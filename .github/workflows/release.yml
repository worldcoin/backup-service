name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: arc-public-large-amd64-runner
    permissions:
      contents: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 https://github.com/actions/checkout/releases/tag/v7.0.0
        with:
          fetch-depth: 0 # release-plz derives the changelog from the full history
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz release
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131 https://github.com/release-plz/action/releases/tag/v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_BOT_TOKEN }}

      - name: Resolve image version and source commit
        id: version
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
          RELEASES_CREATED: ${{ steps.release-plz.outputs.releases_created }}
        run: |
          set -euo pipefail

          if [[ "$RELEASES_CREATED" == "true" ]]; then
            # release-plz tagged this commit, so build exactly what it released.
            VERSION=$(jq -er 'first(.[].version)' <<<"$RELEASES")
            SOURCE_SHA="$GITHUB_SHA"
          else
            # Re-run to republish the image for the current release. Build the commit the release tag
            # points at, never the dispatch SHA: main may have moved on since the release, and
            # building it would replace a published artifact with different source.
            VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -er '.packages[] | select(.name == "backup-service") | .version')
            if ! SOURCE_SHA=$(git rev-list -n 1 "refs/tags/$VERSION" 2>/dev/null); then
              echo "::error::No release tag '$VERSION' exists, so there is no published image to rebuild."
              exit 1
            fi
          fi

          # Accept the full SemVer grammar, including prereleases, so that `git_release_type = "auto"`
          # can classify a release-plz prerelease without the image build being rejected here.
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error::Resolved version '$VERSION' is not valid SemVer."
            exit 1
          fi
          # A Docker tag cannot contain '+', so SemVer build metadata has no representable tag.
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Version '$VERSION' is valid SemVer but not a valid Docker tag."
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then IS_PRERELEASE=true; else IS_PRERELEASE=false; fi

          echo "Building $VERSION from $SOURCE_SHA (prerelease: $IS_PRERELEASE)"
          {
            echo "version=$VERSION"
            echo "source_sha=$SOURCE_SHA"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker Build
    needs: [release]
    if: needs.release.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on:
      group: arc-public-large-amd64-runner
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout released commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 https://github.com/actions/checkout/releases/tag/v7.0.0
        with:
          ref: ${{ needs.release.outputs.source_sha }}
          persist-credentials: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ needs.release.outputs.is_prerelease != 'true' }}
            type=raw,value=${{ needs.release.outputs.version }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0 https://github.com/docker/login-action/releases/tag/v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_REV=${{ needs.release.outputs.source_sha }}
          cache-from: type=gha
          cache-to: "type=gha,mode=max,ignore-error=true"
          platforms: linux/amd64

      - name: Attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1 https://github.com/actions/attest-build-provenance/releases/tag/v4.1.1
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}

  release-pr:
    name: Release PR
    needs: [release]
    runs-on:
      group: arc-public-large-amd64-runner
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 https://github.com/actions/checkout/releases/tag/v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131 https://github.com/release-plz/action/releases/tag/v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_BOT_TOKEN }}
