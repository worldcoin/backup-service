name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Releases must not overlap: concurrent runs would race on tag creation and on the release PR.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on:
      group: arc-public-large-amd64-runner
    permissions:
      contents: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 https://github.com/actions/checkout/releases/tag/v7.0.0
        with:
          fetch-depth: 0 # release-plz derives the changelog from the full history
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz release
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131 https://github.com/release-plz/action/releases/tag/v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_BOT_TOKEN }}

      - name: Resolve version to publish
        id: version
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r 'first(.[].version) // ""' <<<"${RELEASES:-[]}")
          if [[ -z "$VERSION" ]]; then
            # Nothing released this run (e.g. a manual re-run to republish the image).
            VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -er '.packages[] | select(.name == "backup-service") | .version')
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Resolved version '$VERSION' is not semver; refusing to tag an image with it."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker Build
    needs: [release]
    if: needs.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on:
      group: arc-public-large-amd64-runner
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 https://github.com/actions/checkout/releases/tag/v7.0.0
        with:
          persist-credentials: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0 https://github.com/docker/login-action/releases/tag/v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_REV=${{ github.sha }}
          cache-from: type=gha
          cache-to: "type=gha,mode=max,ignore-error=true"
          platforms: linux/amd64

      - name: Attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1 https://github.com/actions/attest-build-provenance/releases/tag/v4.1.1
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}

  release-pr:
    name: Release PR
    needs: [release]
    runs-on:
      group: arc-public-large-amd64-runner
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 https://github.com/actions/checkout/releases/tag/v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131 https://github.com/release-plz/action/releases/tag/v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_BOT_TOKEN }}
